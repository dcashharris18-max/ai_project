# AI Multi-Domain Trading System Configuration

# Cryptocurrency Trading Settings
crypto_trading:
  enabled: true
  exchanges:
    - binance
    - coinbase
  trading_pairs:
    - BTC/USDT
    - ETH/USDT
    - BNB/USDT
  risk_level: medium
  max_position_size: 1000
  stop_loss_percentage: 5.0

# International Trade Settings
international_trade:
  enabled: true
  regions:
    - North America
    - Europe
    - Asia
  trade_types:
    - import
    - export
  compliance_check: true

# Marketplace Settings
marketplace:
  enabled: true
  platforms:
    - amazon
    - ebay
    - etsy
  categories:
    - electronics
    - fashion
    - home_goods
  pricing_strategy: dynamic

# Social Media Settings
social_media:
  enabled: true
  platforms:
    - twitter
    - facebook
    - instagram
    - linkedin
  posting_frequency: daily
  engagement_tracking: true

# Construction Settings
construction:
  enabled: true
  project_types:
    - residential
    - commercial
    - infrastructure
  cost_estimation: true
  resource_planning: true

# Marketing Settings
marketing:
  enabled: true
  channels:
    - email
    - social
    - seo
    - ppc
  campaign_optimization: true
  ab_testing: true
  analytics_tracking: true

# AI Model Settings
ai_model:
  model_type: neural_network
  learning_rate: 0.001
  epochs: 100
  batch_size: 32
  validation_split: 0.2
  early_stopping: true
  
# General Settings
general:
  log_level: INFO
  database_url: sqlite:///ai_trading.db
  redis_url: redis://localhost:6379
  update_interval: 300
